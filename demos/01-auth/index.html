<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo 1 · Authentication</title>
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="demo-header">
        <h1>
          <span class="step">Demo 1</span>
          Authentication
        </h1>
        <a href="/">&larr; all demos</a>
      </header>

      <!-- Signed OUT -->
      <section id="signed-out" hidden>
        <div class="card">
          <h2>Sign in</h2>
          <form id="signin-form">
            <label for="signin-email">Email</label>
            <input id="signin-email" type="email" autocomplete="email" required />
            <label for="signin-password">Password</label>
            <input id="signin-password" type="password" autocomplete="current-password" required />
            <button class="btn" type="submit">Sign in</button>
          </form>
          <div class="divider">or</div>
          <button id="google-btn" class="btn secondary" type="button">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continue with Google
          </button>
        </div>

        <div class="card">
          <h2>Create an account</h2>
          <form id="signup-form">
            <label for="signup-email">Email</label>
            <input id="signup-email" type="email" autocomplete="email" required />
            <label for="signup-password">Password</label>
            <input id="signup-password" type="password" autocomplete="new-password" required minlength="6" />
            <button class="btn" type="submit">Sign up</button>
          </form>
        </div>
      </section>

      <!-- Signed IN -->
      <section id="signed-in" hidden>
        <div class="card">
          <h2>Signed in</h2>
          <div class="user-chip">
            <div class="avatar" id="user-avatar"></div>
            <div>
              <div class="email" id="user-email"></div>
              <div class="mono">uid: <span id="user-uid"></span></div>
              <div class="mono">provider: <span id="user-provider"></span></div>
            </div>
          </div>
          <pre class="token" id="token-claims"></pre>
          <button id="signout-btn" class="btn secondary" type="button">Sign out</button>
        </div>
        <p class="hint">
          The session persists in this browser &mdash; continue with
          <a href="/demos/02-database/">Demo 2: Database</a>.
        </p>
      </section>

      <div id="message" class="banner"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
